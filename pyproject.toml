[project]
name = "lumen"
version = "0.1.0"
description = "Lumen — anomaly detection, incident correlation and grounded explanation platform core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "duckdb>=1.0",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "openai>=2.38,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2",
]
neo4j = [
    "neo4j>=5.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
